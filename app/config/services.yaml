# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Port Vente/Réservation (M2/M5) : implémentation réelle M2 (une vente validée = dépendance
    # active), remplace le stub L1 pour que « dépublier » de M1 réagisse correctement (plan L2 T6).
    App\Offre\Port\DependanceVenteInterface: '@App\Vente\Service\DependanceVenteM2'

    # --- M2 Vente & Caisse : liaisons des ports (stubs L2, à câbler aux modules réels) ---
    # Référentiel des moyens de paiement & acte de régie (frontière M6, RG-M2-02) : câblé au
    # référentiel réel M6 (L4, §3 du plan-compta) — remplace le stub L2, aucune modification de M2.
    App\Vente\Port\ReferentielReglementInterface: '@App\Compta\Adapter\ReferentielReglementDoctrineAdapter'
    # Rattachement/création client (frontière M4, US-L2-05) : `App\Crm\Adapter\ClientM4Adapter` (L5)
    # est livré et testé isolément, mais **non câblé ici** — le remplacer casserait des tests M2
    # existants qui documentent explicitement le contrat du stub (recherche toujours positive,
    # ex. `App\Tests\Vente\Api\PanierTest::testCa7RattachementClientOuAnonyme`) ; les faire évoluer
    # relève d'une coordination M2/M4 hors périmètre de ce lot (priorité « zéro régression M2 »).
    App\Vente\Port\ClientM4Interface: '@App\Vente\Port\ClientM4Stub'
    # Appairage/invalidation des supports d'accès (frontière module Accès L3, US-L2-08/09).
    App\Vente\Port\AppairageAccesInterface: '@App\Vente\Port\AppairageAccesStub'
    # Porte-monnaie virtuel (frontière M4, RG-M4-03, §2.1 plan-crm.md) : câblé à l'adaptateur réel
    # (débit atomique) — remplace le stub L2. Modification prudente de PaiementHandler/
    # ContrePassationHandler (T9) : comportement par défaut inchangé si aucun port n'est fourni.
    App\Vente\Port\PorteMonnaieVirtuelInterface: '@App\Crm\Adapter\PorteMonnaieVirtuelAdapter'
    # Recherche client par n° de support/carte (frontière M4, CA-1, §2.3 plan-crm.md).
    App\Vente\Port\RechercheSupportInterface: '@App\Vente\Adapter\RechercheSupportParSupport'
    # Historique d'achats par client (frontière M4, fiche 360°, §2.4 plan-crm.md).
    App\Vente\Port\HistoriqueVenteInterface: '@App\Vente\Adapter\HistoriqueVenteParClient'
    # Connecteur TPE (Ingenico/Nayax/PAX) — mock en L2 (US-L2-07).
    App\Vente\Tpe\TerminalPaiementInterface: '@App\Vente\Tpe\TpeMock'
    # Signataire NF525 enfichable — chaînage sha256 + HMAC placeholder (US-L2-11, procédé à valider).
    App\Vente\Nf525\SignataireOperation: '@App\Vente\Nf525\HashChainSignataire'

    # --- L3 Contrôle d'accès : ports & adaptateurs (§2 du plan) ---
    # Pilote matériel enfichable (OSDP/API ITBOX/SmartAccess non cadrés, point ouvert n°1) : simulateur
    # logiciel en dev/test, ItboxAdapter/SmartAccessAdapter restent des squelettes (à cadrer IT Cotation).
    App\Acces\Port\PiloteAcces: '@App\Acces\Adapter\SimulateurAccesAdapter'
    # Projection locale d'un droit vendu M1/M2 (point ouvert n°9) — stub L3, consommateur d'événements
    # réel à l'intégration L4. Public : accessible depuis les tests (App\Acces\State\AppairageProcessor
    # l'utilise aussi lorsqu'un appairage référence un support M2 non encore projeté).
    App\Acces\Port\ProjectionDroitInterface:
        alias: App\Acces\Projection\StubProjectionDroit
        public: true

    # Recalage FMI (§4.5/4.6) : public pour accès direct depuis les tests (RecalageFmiHandler est
    # utilisé en production par App\Acces\Service\SynchroPassageHandler).
    App\Acces\Service\RecalageFmiHandler:
        public: true

    # --- M6 Comptabilité & Régie (L4) : liaisons des ports (§3/§4/§7 du plan-compta) ---
    App\Compta\Port\ProjectionVenteInterface: '@App\Compta\Adapter\ProjectionVenteDoctrineAdapter'
    App\Compta\Port\ProjectionPassageInterface: '@App\Compta\Adapter\ProjectionPassageDoctrineAdapter'
    # PayFiP (US-L4-03) : protocole exact non détaillé dans les sources (⚠ HYPOTHÈSE) — stub par défaut.
    App\Compta\Port\PayFipInterface: '@App\Compta\Adapter\PayFipStubAdapter'
    # e-reporting (US-L4-08) : canal PDP non nommé dans les sources (⚠ HYPOTHÈSE) — stub par défaut.
    App\Compta\Port\PdpInterface: '@App\Compta\Adapter\PdpStubAdapter'
    # Chorus Pro B2G (§4.7 spec) : format exact non détaillé (⚠ HYPOTHÈSE) — stub par défaut.
    App\Compta\Port\ChorusProInterface: '@App\Compta\Adapter\ChorusProStubAdapter'

    # --- Verticale Sport/Fitness : ports & adaptateurs (§2 du plan-sport) ---
    # Projection comptable des encaissements/impayés SEPA : file d'attente append-only (Risque n°1,
    # aucun fichier App\Compta\* modifié — aucune écriture NF525 scellée produite par ce lot).
    App\Sport\Compta\Port\ProjectionEcritureSepaInterface: '@App\Sport\Compta\Adapter\MouvementComptableSepaQueueAdapter'
    # Port SEPA fourni PAR Sport AU module partagé App\Sepa (plan-sepa.md §3/§5) : agrégé par
    # `App\Sepa\Service\CompositeEcheanceSepaSource` (point d'entrée générique `/sepa/remises/generer`).
    App\Sport\Sepa\SportEcheanceSepaSource:
        tags: ['sepa.echeance_source']
    # Port `RedevablePort` fourni PAR Sport AU moteur de recouvrement partagé App\Recouvrement (refactor
    # extraction) : agrégé par `App\Recouvrement\Service\RedevableRegistry` (même patron que
    # `SportEcheanceSepaSource`/`CompositeEcheanceSepaSource` ci-dessus).
    App\Sport\Recouvrement\AbonnementFitnessRedevablePort:
        tags: ['recouvrement.redevable_port']
    # Public pour accès direct depuis les tests (preuve du recâblage Sport → module SEPA partagé,
    # même patron que `App\Acces\Service\RecalageFmiHandler`) — aucune route Sport dédiée ne le consomme
    # plus (la génération de remise passe désormais par le point d'entrée générique
    # `POST /sepa/remises/generer`, `App\Sepa\State\GenererRemiseSepaProcessor`, qui agrège
    # `SportEcheanceSepaSource` via `CompositeEcheanceSepaSource`) ; ce service reste utilisable
    # directement par une future commande planifiée propre à Sport.
    App\Sport\Service\GenererRemiseSepaHandler:
        public: true

    # --- Module SEPA partagé App\Sepa (plan-sepa.md §4) : ports & adaptateurs ---
    # Transmission bancaire d'une remise déjà générée (pain.008) : aucun moteur d'exécution SEPA réel
    # (EBICS/SFTP) — stub par défaut (repris de App\Sport, généralisé, §9 du plan-sepa).
    App\Sepa\Port\CollecteurSepaInterface:
        alias: App\Sepa\Adapter\CollecteurSepaStubAdapter
        public: true
    App\Sepa\Adapter\CollecteurSepaStubAdapter:
        public: true
    # Ingestion des retours SEPA (rejets) : aucun parser pain.002/CAMT.054 réel — stub par défaut,
    # public pour injection de retours en test.
    App\Sepa\Port\RetourSepaInterface:
        alias: App\Sepa\Adapter\RetourSepaStubAdapter
        public: true
    App\Sepa\Adapter\RetourSepaStubAdapter:
        public: true
    # Tokenisation IBAN — HMAC applicatif (repris de App\Sport, ⚠ non un vrai coffre-fort PCI-DSS).
    App\Sepa\Port\TokenisationIbanInterface: '@App\Sepa\Adapter\TokenisationIbanHmacAdapter'
    App\Sepa\Adapter\TokenisationIbanHmacAdapter:
        arguments:
            $cle: '%env(SEPA_IBAN_HMAC_KEY)%'

    # --- Module de recouvrement partagé App\Recouvrement (refactor extraction depuis App\Sport,
    # réutilisable par toute activité à abonnement : Sport, Piscine en régie, futures) : ports & adaptateurs ---
    # Encaissement CB immédiat (résolution 1 clic) : PSP non nommé par les sources (Risque n°4, repris
    # de App\Sport, généralisé) — stub par défaut.
    App\Recouvrement\Port\EncaissementImmediatInterface: '@App\Recouvrement\Adapter\EncaissementImmediatStubAdapter'

    # --- Module socle M5 App\Reservation (plan-reservation.md) : ports & stratégies ---
    # Frontière M1/M4 (Risque n°5 du plan) : aucun rattachement bénéficiaire↔formule modélisé à ce
    # jour — stub public (tests injectent un scénario via `definir()`, patron `RetourSepaStubAdapter`).
    App\Reservation\Port\FormuleBeneficiaireInterface:
        alias: App\Reservation\Port\Adapter\FormuleBeneficiaireStub
        public: true
    App\Reservation\Port\Adapter\FormuleBeneficiaireStub:
        public: true
    # Notification du bénéficiaire (promotion liste d'attente, arbitrage récurrence) : aucun canal
    # email/SMS/push spécifié dans ce dépôt — journalisation par défaut.
    App\Reservation\Port\NotificationReservationInterface: '@App\Reservation\Port\Adapter\NotificationReservationLogAdapter'
    # Stratégies de facturation no-show (décision structurante n°4 du plan), agrégées par
    # `ResolveurStrategieFacturation` via le tag `reservation.strategie_facturation_no_show`.
    App\Reservation\Facturation\VenteDiffereeAgentStrategie:
        tags: ['reservation.strategie_facturation_no_show']
    App\Reservation\Facturation\DebitPmvStrategie:
        tags: ['reservation.strategie_facturation_no_show']
    App\Reservation\Facturation\PrelevementDiffereStrategie:
        tags: ['reservation.strategie_facturation_no_show']
    App\Reservation\Facturation\FactureAEncaisserStrategie:
        tags: ['reservation.strategie_facturation_no_show']
    App\Reservation\Facturation\ResolveurStrategieFacturation:
        arguments:
            $strategies: !tagged_iterator reservation.strategie_facturation_no_show
    # Port SEPA fourni PAR Reservation AU module partagé App\Sepa (squelette `prelevement_differe`,
    # Risque n°1 du plan) — même patron que `App\Sport\Sepa\SportEcheanceSepaSource`. Public pour accès
    # direct depuis les tests (même patron que `RecalageFmiHandler`/`GenererRemiseSepaHandler`).
    App\Reservation\Sepa\ReservationEcheanceSepaSource:
        tags: ['sepa.echeance_source']
        public: true
    # Services applicatifs publics pour accès direct depuis les tests (report de récurrence, promotion
    # de liste d'attente, bascule no-show planifiée — même patron que `RecalageFmiHandler`).
    App\Reservation\Service\RecurrenceReportHandler:
        public: true
    App\Reservation\Service\PromotionListeAttenteHandler:
        public: true
    App\Reservation\Command\BasculerNoShowCommand:
        public: true
