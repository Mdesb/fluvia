        public: true
    App\Boutique\Identite\FournisseurIdentiteStubAdapter:
        public: true
    # Paiement en ligne commuté PayFiP/PSP CB (RG-M3-11) : résolu via l'itérateur taggé
    # `boutique.paiement_en_ligne` (auto-tag `#[AutoconfigureTag]`, aucun binding d'interface unique
    # nécessaire ici — même patron que `App\Compta\Regime\RegimeComptableResolver`).
    # Connecteur OTA générique L8 : aucune intégration technique par plateforme (Risque n°6) — stub
    # par défaut, public pour introspection du journal en test (même patron que
    # `App\Musee\Port\ConnecteurOtaInterface`/`StubConnecteurOtaAdapter`).
    App\Boutique\Ota\ConnecteurOtaInterface:
        alias: App\Boutique\Ota\StubConnecteurOtaAdapter
        public: true
    App\Boutique\Ota\StubConnecteurOtaAdapter:
        public: true

    # --- Module Base de connaissance & Support (plan-support.md) ---
    # Doc vivante docs/aide/<module>/<slug>.md (§5.1 plan) : ⚠ écart au plan (contrainte
    # d'environnement docker-compose.yml, seul ./app est bind-monté dans le conteneur php) — placée
    # sous app/docs/aide plutôt qu'à la racine du dépôt, cf. commentaire `ImporterAideCommand`.
    App\Support\Command\ImporterAideCommand:
        public: true
        arguments:
            $cheminAideParDefaut: '%kernel.project_dir%/docs/aide'
    App\Support\State\ImportExecuterProcessor:
        arguments:
            $cheminAideParDefaut: '%kernel.project_dir%/docs/aide'
    # Délai de réouverture d'un ticket fermé (RG-SUP-11, ⚠ non chiffré par les sources, Risque n°4 du
    # plan) — paramètre applicatif plutôt qu'une valeur en dur (constitution §4 point 4).
    App\Support\State\RouvrirTicketProcessor:
        arguments:
            $delaiReouvertureJours: 15

# --- Test uniquement : collecteur d'e-mails L8 Boutique (billet PDF/QR + e-mails HTML, cf.
# app/tests/Boutique/Support/MailCollector.php) — écoute `Symfony\Component\Mailer\Event\MessageEvent`,
# dispatché par `AbstractTransport::send()` indépendamment du DSN (`null://null` en test), sans
# nécessiter le profiler (non installé dans ce dépôt).
    # T6 — le chargeur de fixtures n'est pas auto-cablable : le bundle l'enregistre sous l'identifiant
    # `doctrine.fixtures.loader`, pas sous son nom de classe. Symfony le dit lui-meme dans son message
    # d'erreur, ce qui evite d'avoir a le deviner.
    App\Platform\Command\ChargerDemonstrationCommand:
        arguments:
            $chargeur: '@doctrine.fixtures.loader'

    # T6 — le purgeur de `doctrine:fixtures:load` refuse de vider une base hors `dev`/`test`.
    #
    # ⚠ On redefinit **l'identifiant de service du bundle**, pas un service de plus portant le meme
    # alias. La premiere version faisait l'inverse et ne mordait pas : le compilateur du bundle
    # construit une carte alias -> service, et c'est sa definition qui gagnait. Mesure, pas deduction —
    # le chargement en `prod` affichait « purging database ». Redefinir l'identifiant remplace la
    # definition d'origine, ce qui ne depend d'aucun ordre.
    #
    # ⚠ Le repli de `LoadDataFixturesDoctrineCommand` (ligne 115) instancie un `ORMPurgerFactory` en dur
    # quand l'alias demande est introuvable. On garde donc l'alias `default` : le supprimer rouvrirait
    # la purge par ce chemin, sans rien dire.
    doctrine.fixtures.purger.orm_purger_factory:
        class: App\Platform\DataFixtures\PurgeurInterditHorsDeveloppement
        arguments:
            $environnement: '%kernel.environment%'
        tags:
            - { name: 'doctrine.fixtures.purger_factory', alias: 'default' }

when@test:
    services:
        App\Tests\Boutique\Support\MailCollector:
            public: true
            tags: ['kernel.event_subscriber']
        # Collecteur `access.card_recharged` (CQ-1, tests d'atomicité recharge ⇄ vente, D7-bis) — même
        # patron que MailCollector ci-dessus.
        App\Tests\Acces\Support\CardRechargedEventCollector:
            public: true
            tags: ['kernel.event_subscriber']
        # Collecteur `booking.no_show`/`booking.cancelled`/`booking.reschedule_requested` (CQ-5,
        # plan-cq5.md §7 T11) — même patron que CardRechargedEventCollector ci-dessus.
        App\Tests\Reservation\Support\NoShowCreditEventCollector:
            public: true
            tags: ['kernel.event_subscriber']
