# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Port Vente/Réservation (M2/M5) : implémentation réelle M2 (une vente validée = dépendance
    # active), remplace le stub L1 pour que « dépublier » de M1 réagisse correctement (plan L2 T6).
    App\Offre\Port\DependanceVenteInterface: '@App\Vente\Service\DependanceVenteM2'

    # --- M2 Vente & Caisse : liaisons des ports (stubs L2, à câbler aux modules réels) ---
    # Référentiel des moyens de paiement & acte de régie (frontière M6, RG-M2-02) : câblé au
    # référentiel réel M6 (L4, §3 du plan-compta) — remplace le stub L2, aucune modification de M2.
    App\Vente\Port\ReferentielReglementInterface: '@App\Compta\Adapter\ReferentielReglementDoctrineAdapter'
    # Rattachement/création client (frontière M4, US-L2-05) : `App\Crm\Adapter\ClientM4Adapter` (L5)
    # est livré et testé isolément, mais **non câblé ici** — le remplacer casserait des tests M2
    # existants qui documentent explicitement le contrat du stub (recherche toujours positive,
    # ex. `App\Tests\Vente\Api\PanierTest::testCa7RattachementClientOuAnonyme`) ; les faire évoluer
    # relève d'une coordination M2/M4 hors périmètre de ce lot (priorité « zéro régression M2 »).
    App\Vente\Port\ClientM4Interface: '@App\Vente\Port\ClientM4Stub'
    # Appairage/invalidation des supports d'accès (frontière module Accès L3, US-L2-08/09).
    App\Vente\Port\AppairageAccesInterface: '@App\Vente\Port\AppairageAccesStub'
    # Porte-monnaie virtuel (frontière M4, RG-M4-03, §2.1 plan-crm.md) : câblé à l'adaptateur réel
    # (débit atomique) — remplace le stub L2. Modification prudente de PaiementHandler/
    # ContrePassationHandler (T9) : comportement par défaut inchangé si aucun port n'est fourni.
    App\Vente\Port\PorteMonnaieVirtuelInterface: '@App\Crm\Adapter\PorteMonnaieVirtuelAdapter'
    # Recherche client par n° de support/carte (frontière M4, CA-1, §2.3 plan-crm.md).
    App\Vente\Port\RechercheSupportInterface: '@App\Vente\Adapter\RechercheSupportParSupport'
    # Historique d'achats par client (frontière M4, fiche 360°, §2.4 plan-crm.md).
    App\Vente\Port\HistoriqueVenteInterface: '@App\Vente\Adapter\HistoriqueVenteParClient'
    # Connecteur TPE (Ingenico/Nayax/PAX) — mock en L2 (US-L2-07).
    App\Vente\Tpe\TerminalPaiementInterface: '@App\Vente\Tpe\TpeMock'
    # Signataire NF525 enfichable — chaînage sha256 + HMAC placeholder (US-L2-11, procédé à valider).
    App\Vente\Nf525\SignataireOperation: '@App\Vente\Nf525\HashChainSignataire'

    # --- L3 Contrôle d'accès : ports & adaptateurs (§2 du plan) ---
    # Pilote matériel enfichable (OSDP/API ITBOX/SmartAccess non cadrés, point ouvert n°1) : simulateur
    # logiciel en dev/test, ItboxAdapter/SmartAccessAdapter restent des squelettes (à cadrer IT Cotation).
    App\Acces\Port\PiloteAcces: '@App\Acces\Adapter\SimulateurAccesAdapter'
    # Projection locale d'un droit vendu M1/M2 (point ouvert n°9) — stub L3, consommateur d'événements
    # réel à l'intégration L4. Public : accessible depuis les tests (App\Acces\State\AppairageProcessor
    # l'utilise aussi lorsqu'un appairage référence un support M2 non encore projeté).
    App\Acces\Port\ProjectionDroitInterface:
        alias: App\Acces\Projection\StubProjectionDroit
        public: true

    # Recalage FMI (§4.5/4.6) : public pour accès direct depuis les tests (RecalageFmiHandler est
    # utilisé en production par App\Acces\Service\SynchroPassageHandler).
    App\Acces\Service\RecalageFmiHandler:
        public: true

    # --- M6 Comptabilité & Régie (L4) : liaisons des ports (§3/§4/§7 du plan-compta) ---
    App\Compta\Port\ProjectionVenteInterface: '@App\Compta\Adapter\ProjectionVenteDoctrineAdapter'
    App\Compta\Port\ProjectionPassageInterface: '@App\Compta\Adapter\ProjectionPassageDoctrineAdapter'
    # PayFiP (US-L4-03) : protocole exact non détaillé dans les sources (⚠ HYPOTHÈSE) — stub par défaut.
    App\Compta\Port\PayFipInterface: '@App\Compta\Adapter\PayFipStubAdapter'
    # e-reporting (US-L4-08) : canal PDP non nommé dans les sources (⚠ HYPOTHÈSE) — stub par défaut.
    App\Compta\Port\PdpInterface: '@App\Compta\Adapter\PdpStubAdapter'
    # Chorus Pro B2G (§4.7 spec) : format exact non détaillé (⚠ HYPOTHÈSE) — stub par défaut.
    App\Compta\Port\ChorusProInterface: '@App\Compta\Adapter\ChorusProStubAdapter'

    # --- Verticale Sport/Fitness : ports & adaptateurs (§2 du plan-sport) ---
    # Collecte bancaire SEPA (remise/retours) : aucun moteur d'exécution SEPA n'existe ailleurs dans le
    # dépôt (spec §8 point 3, gap confirmé) — stub par défaut, public pour injection de retours en test.
    App\Sport\Sepa\Port\CollecteurSepaInterface:
        alias: App\Sport\Sepa\Adapter\CollecteurSepaStubAdapter
        public: true
    App\Sport\Sepa\Adapter\CollecteurSepaStubAdapter:
        public: true
    # Tokenisation IBAN — HMAC applicatif (Risque n°3, ⚠ non un vrai coffre-fort PCI-DSS).
    App\Sport\Sepa\Port\TokenisationIbanInterface: '@App\Sport\Sepa\Adapter\TokenisationIbanHmacAdapter'
    App\Sport\Sepa\Adapter\TokenisationIbanHmacAdapter:
        arguments:
            $cle: '%env(SPORT_IBAN_HMAC_KEY)%'
    # Encaissement CB immédiat (résolution 1 clic, RG-SPORT-03) : PSP non nommé par les sources (Risque n°4) — stub par défaut.
    App\Sport\Paiement\Port\EncaissementImmediatInterface: '@App\Sport\Paiement\Adapter\EncaissementImmediatStubAdapter'
    # Projection comptable des encaissements/impayés SEPA : file d'attente append-only (Risque n°1,
    # aucun fichier App\Compta\* modifié — aucune écriture NF525 scellée produite par ce lot).
    App\Sport\Compta\Port\ProjectionEcritureSepaInterface: '@App\Sport\Compta\Adapter\MouvementComptableSepaQueueAdapter'
