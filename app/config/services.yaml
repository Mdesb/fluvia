# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # D104 : le domaine sous lequel vivent les sous-domaines clients. Lie explicitement
            # parce que l'autowiring ne devine pas une chaine.
            string $domaineDePlateforme: '%env(PLATFORM_BASE_DOMAIN)%'
            # Le marqueur de version chargee vit dans `var/`, hors du depot : le provider a besoin
            # de la racine pour le trouver.
            string $projectDir: '%kernel.project_dir%'
            # Le DSN du mailer, lu comme un FAIT et non devine depuis APP_ENV : une
            # preproduction peut porter `null://` (c'etait le cas le 15/09/2026) et un
            # environnement de test peut recevoir un vrai transport. Voir
            # `Reporting\Notification\TransportCourrielSelonDsn`.
            string $mailerDsn: '%env(MAILER_DSN)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Patron de decorateur, jamais un service : UuidAwareSearchFilterPass en pose une
            # instance par filtre decore. Enregistre ici, il serait etiquete comme filtre et le
            # localisateur d'API Platform reclamerait un service que personne ne peut construire.
            - '../src/Platform/Filter/UuidAwareSearchFilter.php'

    # LE CALENDRIER SCOLAIRE OFFICIEL, derriere un port.
    #
    # Une seule implementation aujourd'hui — l'open data du ministere. L'alias est explicite quand
    # meme : le jour ou l'on ajoute un decorateur de cache ou un adaptateur de secours, l'autowiring
    # ne saura plus choisir, et il choisira en silence.
    App\Opening\Port\SchoolHolidaysInterface: '@App\Opening\Adapter\EducationGouvSchoolHolidays'

    # Point de passage unique vers le client (CMP-1). L'implementation par defaut JOURNALISE et
    # n'envoie rien : aucun prestataire n'est branche (D19, CMP-6). L'alias est explicite parce que
    # deux classes implementent l'interface — le journal et le decorateur de consentement de Crm —
    # et l'autowiring ne peut pas choisir seul.
    App\Platform\Notification\ClientNotifierInterface: '@App\Platform\Notification\LogClientNotifier'

    # Le transport expedie-t-il reellement ? Alias explicite, comme celui du dessus : un
    # test doit pouvoir repondre « oui » sous un transport de test qui, lui, n'expedie pas,
    # sans quoi le chemin `StatutExport::Envoye` ne serait couvert par aucun test.
    App\Reporting\Notification\TransportCourrielInterface: '@App\Reporting\Notification\TransportCourrielSelonDsn'

    # ⚠ ALIAS DEVENU OBLIGATOIRE LE 06/09. Symfony le déduisait tant qu'une seule classe implémentait
    # `EventBus` ; le décorateur du module « connecteurs » en est une seconde, et la déduction cesse
    # alors — sans erreur au démarrage, jusqu'à ce qu'un consommateur soit construit.
    # La décoration réattribue l'identifiant de `SymfonyEventBus` au décorateur : cet alias résout
    # donc vers lui, et les six consommateurs de l'interface ne changent pas d'une ligne.
    App\Platform\Event\EventBus: '@App\Platform\Event\SymfonyEventBus'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Port Vente/Réservation (M2/M5) : implémentation réelle M2 (une vente validée = dépendance
    # active), remplace le stub L1 pour que « dépublier » de M1 réagisse correctement (plan L2 T6).
    App\Offre\Port\DependanceVenteInterface: '@App\Vente\Service\DependanceVenteM2'

    # --- M2 Vente & Caisse : liaisons des ports (stubs L2, à câbler aux modules réels) ---
    # Référentiel des moyens de paiement & acte de régie (frontière M6, RG-M2-02) : câblé au
    # référentiel réel M6 (L4, §3 du plan-compta) — remplace le stub L2, aucune modification de M2.
    App\Vente\Port\ReferentielReglementInterface: '@App\Compta\Adapter\ReferentielReglementDoctrineAdapter'
    # Rattachement/création client (frontière M4, US-L2-05) : `App\Crm\Adapter\ClientM4Adapter` (L5)
    # est livré et testé isolément, mais **non câblé ici** — le remplacer casserait des tests M2
    # existants qui documentent explicitement le contrat du stub (recherche toujours positive,
    # ex. `App\Tests\Vente\Api\PanierTest::testCa7RattachementClientOuAnonyme`) ; les faire évoluer
    # relève d'une coordination M2/M4 hors périmètre de ce lot (priorité « zéro régression M2 »).
    App\Vente\Port\ClientM4Interface: '@App\Vente\Port\ClientM4Stub'
    # Appairage/invalidation des supports d'accès (frontière module Accès L3, US-L2-08/09).
    # ── LE PONT VENTE → CONTROLE D'ACCES ───────────────────────────────────────────────────────
    #
    # Jusqu'au 30/08 ce port pointait sur `App\Vente\Port\AppairageAccesStub`, qui bascule un statut
    # sur le BilletSupport et ne parle JAMAIS au module Acces. Mesure : 5 billets vendus, 5 supports
    # d'acces, AUCUN croisement — le tourniquet repondait « Support inconnu » a un code dont il
    # savait pourtant verifier la signature.
    #
    # `ValiderVenteService:149` appelait deja `appairer()` a chaque vente. Rien n'etait a ecrire cote
    # vente : il manquait l'implementation du port, c'est-a-dire ce que le stub annoncait tenir en
    # attendant la couche L3.
    #
    # ⚠ L'adaptateur ne projette QUE si le produit declare une zone d'acces. Un droit sans espace
    # ouvre TOUT (`DroitAcces::ouvre()`), et 0 produit sur 17 en declarait une : projeter sans
    # condition aurait fait de chaque billet vendu un passe-partout des 8 espaces.
    App\Vente\Port\AppairageAccesInterface: '@App\Acces\Adapter\SaleAccessPairingAdapter'

    # ED-4 -- le seul chemin par lequel un agent de l editeur lit l etablissement d un client.
    # Le defaut n accorde RIEN : le socle doit tourner sans le module d abonnement, et le repli sur
    # d un mecanisme d acces est de ne pas ouvrir. L adaptateur reel vit dans Subscription, qui tient
    # SupportAccess -- une dependance directe ferait dependre le calcul des droits d un module metier.
    # ⚠ CABLE SUR L'ADAPTATEUR REEL LE 31/08. Jusque-la, le port pointait sur le defaut qui
    # n'accorde RIEN : ouvrir un acces d'assistance ne changeait strictement rien, et aucune erreur
    # ne le signalait. Toute la chaine etait construite — ouvrir, tracer, expirer, revoquer,
    # refuser — sauf le maillon qui sert.
    #
    # `NoSupportAccessRights` reste dans le depot : le socle doit tourner sans le module
    # d'abonnement, et le repli sur d'un mecanisme d'acces est de ne pas ouvrir. C'est le CABLAGE
    # qui change, pas la regle.
    #
    # Ce que l'adaptateur accorde — les droits d'un administrateur — est une decision de Maxime du
    # 31/08, avec sa contrepartie : la trace, journalisee contre l'etablissement DU CLIENT.
    App\Securite\Port\SupportAccessRightsInterface: '@App\Subscription\Adapter\SupportAccessRights'

    # ED-4 -- le pendant du precedent : quels etablissements l'assistance rend VISIBLES.
    #
    # Les droits repondent « que peut faire cet agent ICI ? », sur un etablissement deja designe par
    # l'en-tete. Cette question-la ne suffit a rien d'autre : sans le port de visibilite, l'agent
    # avait tous les droits sur un etablissement qui n'apparaissait dans AUCUNE liste. Le selecteur
    # ne le proposait pas, et l'unique facon d'y entrer etait de forger l'en-tete a la main.
    #
    # ⚠ C'EST LE MEME DEFAUT QUE CELUI DU PORT PRECEDENT, UNE COUCHE PLUS HAUT : un mecanisme
    # complet et inatteignable. Un acces d'assistance qu'on ne peut pas emprunter est un acces qui
    # n'existe pas — et le contournement redevient l'affectation permanente que RG-ED-07 interdit.
    #
    # `NoSupportAccessScope` reste le defaut : sans le module d'abonnement, le cloisonnement
    # ordinaire s'applique inchange.
    App\Securite\Port\SupportAccessScopeInterface: '@App\Subscription\Adapter\SupportAccessScope'
    # Porte-monnaie virtuel (frontière M4, RG-M4-03, §2.1 plan-crm.md) : câblé à l'adaptateur réel
    # (débit atomique) — remplace le stub L2. Modification prudente de PaiementHandler/
    # ContrePassationHandler (T9) : comportement par défaut inchangé si aucun port n'est fourni.
    App\Vente\Port\PorteMonnaieVirtuelInterface: '@App\Crm\Adapter\PorteMonnaieVirtuelAdapter'
    # Recherche client par n° de support/carte (frontière M4, CA-1, §2.3 plan-crm.md).
    App\Vente\Port\RechercheSupportInterface: '@App\Vente\Adapter\RechercheSupportParSupport'
    # Historique d'achats par client (frontière M4, fiche 360°, §2.4 plan-crm.md).
    App\Vente\Port\HistoriqueVenteInterface: '@App\Vente\Adapter\HistoriqueVenteParClient'
    # Connecteur TPE (Ingenico/Nayax/PAX) — mock en L2 (US-L2-07).
    App\Vente\Tpe\TerminalPaiementInterface: '@App\Vente\Tpe\TpeMock'
    # Signataire NF525 enfichable — chaînage sha256 + HMAC placeholder (US-L2-11, procédé à valider).
    App\Vente\Nf525\SignataireOperation: '@App\Vente\Nf525\HashChainSignataire'

