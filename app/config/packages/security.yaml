security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Provider Doctrine sur l'entité Utilisateur (identifiant = email) — RG-SOCLE-06.
    providers:
        app_utilisateurs:
            entity:
                class: App\Securite\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Connexion JWT : POST /auth { "email": ..., "motDePasse": ... } -> jeton (US-L0-02, CA-2).
        # Connexion à 2 étapes si MFA actif (RG-M8-06, §2.3 plan-backoffice.md) : le success_handler
        # décore lexik (jeton complet si MFA inactif, jeton pré-auth « mfaEnAttente » sinon).
        auth:
            pattern: ^/auth$
            stateless: true
            provider: app_utilisateurs
            user_checker: App\Securite\Security\VerificateurUtilisateur
            json_login:
                check_path: /auth
                username_path: email
                password_path: motDePasse
                success_handler: App\Securite\Security\GestionnaireSuccesConnexionMfa
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # API protégée par jeton JWT.
        api:
            pattern: ^/
            stateless: true
            provider: app_utilisateurs
            user_checker: App\Securite\Security\VerificateurUtilisateur
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # AVANT la règle générique ^/auth (PUBLIC_ACCESS) : /auth/mfa-verifier exige le jeton
        # pré-authentifié (§2.3 plan-backoffice.md, CA-5).
        - { path: ^/auth/mfa-verifier, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/docs, roles: PUBLIC_ACCESS }
        - { path: ^/index\.(json|jsonld|html)$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/me, roles: IS_AUTHENTICATED_FULLY }
        # Cycle de vie / MFA / mot de passe oublié (RG-M8-01, US-L7-03, US-L0-03 différée).
        - { path: ^/utilisateurs/activation, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe/oublie, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe/reinitialiser, roles: PUBLIC_ACCESS }
        - { path: ^/audit/export, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
