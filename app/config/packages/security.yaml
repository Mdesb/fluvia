security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Provider Doctrine sur l'entité Utilisateur (identifiant = email) — RG-SOCLE-06.
    providers:
        app_utilisateurs:
            entity:
                class: App\Securite\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Connexion JWT : POST /auth { "email": ..., "motDePasse": ... } -> jeton (US-L0-02, CA-2).
        # Connexion à 2 étapes si MFA actif (RG-M8-06, §2.3 plan-backoffice.md) : le success_handler
        # décore lexik (jeton complet si MFA inactif, jeton pré-auth « mfaEnAttente » sinon).
        auth:
            pattern: ^/auth$
            stateless: true
            provider: app_utilisateurs
            user_checker: App\Securite\Security\VerificateurUtilisateur
            json_login:
                check_path: /auth
                username_path: email
                password_path: motDePasse
                success_handler: App\Securite\Security\GestionnaireSuccesConnexionMfa
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Authentification machine d'un Terminal (borne/ITBOX, US-TERM-01/02, plan-acces-terminal.md
        # §3.1) : firewall dédié, placé AVANT « api », isolé de l'authentification JWT humaine.
        # `pattern` couvre `/api/terminal/*` (préfixe `/api` de toutes les routes API Platform, cf.
        # config/routes/api_platform.yaml) — Symfony évalue les firewalls dans l'ordre et s'arrête au
        # premier `pattern` qui matche : isolation garantie par construction, zéro risque de collision
        # avec l'authenticator JWT du firewall « api » ci-dessous, qui continue de gérer tout le reste
        # (dont `/acces/*`), strictement inchangé.
        terminal:
            pattern: ^/api/terminal
            stateless: true
            custom_authenticators:
                - App\Acces\Security\TerminalAuthenticator

        # Authentification d'une APPLICATION TIERCE sur l'API publique (T1, D101/D102, arbitrage
        # Maxime du 06/09). Même patron que « terminal » ci-dessus, et pour la même raison :
        # pare-feu dédié, placé AVANT « api ». Symfony évalue les pare-feux dans l'ordre et s'arrête
        # au premier `pattern` qui correspond — `^/v1` capture donc toute l'API publique avant que
        # l'authenticator JWT humain ne la voie.
        #
        # ⚠ SI L'ORDRE S'INVERSAIT, un JWT humain serait RESOLU sur `/v1` — mesuré le 06/09 en
        #   inversant volontairement les deux blocs : la requête n'est plus refusée par le pare-feu
        #   (401) mais par `access_control` (403, « The user doesn't have ROLE_PARTNER »).
        #
        #   Autrement dit il y a DEUX barrières indépendantes, et il faut les nommer séparément :
        #   l'ORDRE décide qui authentifie, `access_control` décide qui passe. Perdre l'ordre seul
        #   ne donne donc pas l'accès à un humain — mais ça fait dépendre toute l'isolation d'une
        #   seule ligne d'`access_control`, et ça rend le refus indiscernable d'un problème de
        #   droits. Les deux se gardent, et le témoin
        #   `testUnJetonHumainNeVautRienSurLApiPublique` tombe si l'une des deux cède.
        public_api:
            pattern: ^/v1
            stateless: true
            custom_authenticators:
                - App\PublicApi\Security\PublicApiAuthenticator

        # API protégée par jeton JWT.
        api:
            pattern: ^/
            stateless: true
            provider: app_utilisateurs
            user_checker: App\Securite\Security\VerificateurUtilisateur
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # L'API publique n'accepte QUE le rôle machine des partenaires : un JWT humain, même
        # valide, n'ouvre rien ici (le pare-feu `public_api` ne le résout même pas).
        - { path: ^/v1, roles: ROLE_PARTNER }
        # AVANT la règle générique ^/auth (PUBLIC_ACCESS) : /auth/mfa-verifier exige le jeton
        # pré-authentifié (§2.3 plan-backoffice.md, CA-5).
        - { path: ^/auth/mfa-verifier, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/docs, roles: PUBLIC_ACCESS }
        - { path: ^/index\.(json|jsonld|html)$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # ⚠ ANCRE DE FIN OBLIGATOIRE. `^/me` matchait aussi `/media/...`, `/menu`, `/messages` —
        # et `access_control` s'arrête à la PREMIÈRE règle qui matche. La route publique des photos
        # de produit, déclarée plus bas, était donc rendue privée par cette ligne-ci, avec un 401
        # « JWT Token not found » qui ne désignait rien.
        #
        # Il n'existe qu'une route `/me` : la borner est sans effet de bord, et sans elle toute
        # future route commençant par « me » devient authentifiée sans que personne l'ait décidé.
        - { path: ^/me$, roles: IS_AUTHENTICATED_FULLY }
        # Cycle de vie / MFA / mot de passe oublié (RG-M8-01, US-L7-03, US-L0-03 différée).
        - { path: ^/utilisateurs/activation, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe/oublie, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe/reinitialiser, roles: PUBLIC_ACCESS }
        - { path: ^/audit/export, roles: IS_AUTHENTICATED_FULLY }
        # Photos de produit — lecture publique VOULUE : c'est le visuel du catalogue en ligne, il
        # s'affiche chez des visiteurs qui n'ont pas de compte. Le contrôleur ne sert que des lignes
        # de `offre_product_photo`, et seulement si le produit est publié ET vendu en ligne : la
        # photo d'un brouillon reste privée. Aucun identifiant de document ne passe par cette porte.
        - { path: ^/media/produit/, roles: PUBLIC_ACCESS }
        # Flux ICS de l'agenda — anonyme PAR NECESSITE, et borne par construction.
        #
        # Google, Apple et Outlook interrogent une URL toutes les heures, sans en-tete et sans
        # jeton porteur : exiger une authentification reviendrait a ne pas livrer l'abonnement.
        # L'ADRESSE EST LE SECRET — 192 bits tires de `random_bytes`, nominatifs, bornes a un
        # etablissement, revocables en un geste, et places dans le CHEMIN et non dans la chaine de
        # requete (qui finit dans les journaux de tous les intermediaires).
        #
        # Le chemin est ancre a `^/agenda/ics/` et pas a `^/calendar` : sans cette precision, tout le
        # module — evenements et abonnements compris — deviendrait public. La regle generique qui
        # suit continue de proteger le reste.
        - { path: ^/calendar/ics/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
