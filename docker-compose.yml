services:
  php:
    build:
      context: ./docker/php
    container_name: bill_php
    volumes:
      - ./app:/app
      # Volume dédié pour var/ (cache, logs) : évite la lenteur du bind mount OneDrive
      - app_var:/app/var
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://app:app@db:3306/app?serverVersion=11.4.2-MariaDB&charset=utf8mb4"

  web:
    image: nginx:1.27-alpine
    container_name: bill_web
    ports:
      - "8080:80"
    volumes:
      - ./app:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11.4
    container_name: bill_db
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_var:
