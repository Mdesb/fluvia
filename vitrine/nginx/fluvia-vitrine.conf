# Le site vitrine de Fluvia — l'hôte qui VEND la plateforme.
#
# À NE PAS CONFONDRE avec deux autres choses qui portent le même mot :
#   - `smartaccess.hector-conseil.com` : le back-office et la boutique des établissements clients ;
#   - `frontend/src/public/pages/Vitrine.jsx` : la boutique en ligne d'un établissement client.
# Ici, c'est le site de l'éditeur, lu par des gens qui ne sont pas encore clients.
#
# POURQUOI UN HÔTE SÉPARÉ, ET PAS UNE PAGE DE PLUS DANS LE BACK-OFFICE (D103). Une page de vente
# porte des traceurs et vise le référencement ; le back-office porte des sessions. Les mélanger
# expose les sessions aux scripts tiers d'une page de marketing.
#
# LA SOURCE DE CE FICHIER EST DANS LE DÉPÔT : `vitrine/nginx/fluvia-vitrine.conf`. Ce fichier-ci
# en est une copie, et certbot y a injecté la partie TLS. Ne pas régénérer l'un depuis l'autre
# sans regarder : la conf vivante du VPS est éditée hors git, et l'écraser efface le travail
# d'autres sessions.
#
# Installation :
#   sudo cp vitrine/nginx/fluvia-vitrine.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/fluvia-vitrine.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vitrine.hector-conseil.com

server {
    server_name vitrine.hector-conseil.com;

    root /var/www/fluvia-vitrine;

    # ⚠ PLUS D'`index index.html`, ET C'EST LA CLEF DE LA BASCULE (ED-10). La page d'accueil est
    # desormais rendue par l'application, depuis le contenu que l'editeur ecrit dans son ecran. Tant
    # que cette directive etait la, nginx servait le vieux fichier statique a l'adresse `/` et
    # l'application n'etait jamais appelee : le site aurait affiche l'ancienne page, indefiniment,
    # sans qu'aucune erreur ne le dise.

    # AUCUN CACHE SUR CE SITE, ET C'EST UNE LECON PAYEE LE 04/09.
    #
    # `location /` ne pose aucun en-tete de cache : le navigateur applique alors une heuristique
    # et garde les fichiers plusieurs heures. Un correctif deploye et verifie -- fichier copie,
    # page relue, titre conforme -- restait invisible dans le navigateur, qui servait la version
    # d'avant. On corrigeait un defaut deja corrige.
    #
    # `expires -1` rend `Cache-Control: no-cache` : le navigateur garde le fichier mais revalide
    # a chaque fois. Le cout est un aller-retour conditionnel sur trois petits fichiers ; le prix
    # de l'inverse est de ne pas savoir ce qu'on regarde. Aucun `add_header` ici : il remplacerait
    # ceux du bloc `server` (X-Robots-Tag, CSP), et une page sans eux resterait encadrable.
    expires -1;

    # PAS ENCORE INDEXABLE, ET C'EST UNE DÉCISION RÉVERSIBLE. Ce sous-domaine est l'adresse de
    # travail du site ; le jour où le site part sur son domaine définitif, les pages indexées ici
    # resteraient dans les résultats de recherche, en doublon du vrai site et sans que personne
    # ne les y ait mises. Pour ouvrir l'indexation : retirer cet en-tête ET la ligne `robots.txt`
    # ci-dessous — l'un sans l'autre ne suffit pas.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Le site de vente n'est encadrable nulle part. Sans cet en-tête, n'importe quel site peut
    # afficher nos pages sous son propre nom, y compris le tunnel d'inscription : le prospect
    # saisit ses coordonnées sur une page qu'il croit être celle du site encadrant.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Let's Encrypt doit pouvoir valider le domaine.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # L'API Symfony, sur la MÊME origine que la page. C'est ce qui fait que les tarifs affichés
    # sont les tarifs facturés : `tarifs.js` lit `/api/editor/plans`, et le tunnel écrit sur
    # `/api/editor/carts`. Servir la page et l'API sur deux origines demanderait du CORS pour
    # une page publique — et le back n'autorise en CORS que `content-type` et `authorization`.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Site statique, aucune chaîne de construction : une URL inconnue est une vraie 404, et non
    # la page d'accueil rendue avec un code 200. Le contraire ferait croire à un robot que chaque
    # faute de frappe est une page du site.
    # UN FICHIER S'IL EXISTE, L'APPLICATION SINON.
    #
    # `styles.css`, `tarifs.js`, `tunnel.js` et `confirmation.html` sont des fichiers reels : nginx
    # les sert sans reveiller PHP. Tout le reste — `/`, `/blog`, `/blog/<article>`, `/sitemap.xml` —
    # n'existe pas sur le disque et part a l'application, qui decide. Une page ajoutee au blog ne
    # demande donc AUCUNE modification de ce fichier : c'est ce qui evite qu'un article publie rende
    # 404 parce que personne n'a pense a nginx.
    location / {
        try_files $uri @application;
    }

    location @application {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 1m;

    access_log /var/log/nginx/fluvia-vitrine.access.log;
    error_log  /var/log/nginx/fluvia-vitrine.error.log;

    listen 80;
    listen [::]:80;
}
