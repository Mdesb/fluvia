# Stack de préprod de la billetterie.
# Mêmes images que le dev (php:8.4-fpm, mariadb:11.4, nginx) => parité réelle.
#
# Différences volontaires avec le compose de dev :
#   - APP_ENV=prod, secrets lus depuis .env.preprod (jamais versionnés)
#   - MariaDB n'expose AUCUN port : accessible uniquement via le réseau Docker
#   - Nginx du conteneur publie sur 127.0.0.1 seulement (le Nginx natif de l'hôte
#     fait le reverse proxy + TLS). Publier sur 0.0.0.0 court-circuiterait UFW.
#   - Limites mémoire : la préprod ne doit pas étouffer les agents IA du VPS.
#
# Usage :
#   docker compose -f infra/compose.preprod.yaml --env-file infra/.env.preprod up -d

name: billetterie-preprod

services:
  php:
    build:
      context: ../docker/php
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - ../app:/app
      - app_var:/app/var
      - ../docker/php/conf.d/zz-memory.ini:/usr/local/etc/php/conf.d/zz-memory.ini:ro
      - ../docker/php/conf.d/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET manquant dans .env.preprod}
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=11.4.2-MariaDB&charset=utf8mb4"
      # Symfony est derrière le Nginx de l'hôte : sans ça les URL générées et le
      # détection HTTPS sont fausses.
      TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
      # Phrase secrète protégeant la clé privée JWT. Propre à la préprod : celle
      # de app/.env est une valeur de développement, publique dans le dépôt.
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE manquant dans .env.preprod}
      # ── CLES DE CHIFFREMENT ET DE SCELLEMENT ───────────────────────────────────────────────
      #
      # ⚠ `:?` ET NON UNE VALEUR PAR DEFAUT. Une valeur par defaut ferait demarrer le conteneur
      # sans qu'on apprenne jamais qu'il manque un secret -- c'est exactement comme ca que les cles
      # du depot se sont propagees. Ici l'absence est BRUYANTE.
      # Documents de la GED, chiffres au repos.
      DMS_ENCRYPTION_KEY: ${DMS_ENCRYPTION_KEY:?DMS_ENCRYPTION_KEY manquante dans .env.preprod}
      # Second facteur d'authentification.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY manquante dans .env.preprod}
      # Coordonnees bancaires (mandats SEPA).
      SEPA_IBAN_KEY: ${SEPA_IBAN_KEY:?SEPA_IBAN_KEY manquante dans .env.preprod}
      # Cles d'API tierces confiees par le client.
      OCR_API_KEY_ENCRYPTION_KEY: ${OCR_API_KEY_ENCRYPTION_KEY:?OCR_API_KEY_ENCRYPTION_KEY manquante dans .env.preprod}
      # Jetons des comptes de reseaux sociaux.
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:?SOCIAL_TOKEN_ENCRYPTION_KEY manquante dans .env.preprod}
      # Coffre des URL de webhook du module « connecteurs ». Même forme que ses quatre
      # sœurs : absente, le conteneur refuse de démarrer plutôt que de chiffrer pour de faux.
      INTEGRATIONS_WEBHOOK_KEY: ${INTEGRATIONS_WEBHOOK_KEY:?INTEGRATIONS_WEBHOOK_KEY manquante dans .env.preprod}
      # Signature d’un code de support scanne (billet/carte/badge) : une cle connue = un code
      # d’acces forgeable. Absente, le conteneur refuse de demarrer plutot que de signer pour de faux.
      SUPPORT_HMAC_KEY: ${SUPPORT_HMAC_KEY:?SUPPORT_HMAC_KEY manquante dans .env.preprod}
      # Tokenisation HMAC de l’IBAN (module SEPA partage). Meme regle que ci-dessus.
      SEPA_IBAN_HMAC_KEY: ${SEPA_IBAN_HMAC_KEY:?SEPA_IBAN_HMAC_KEY manquante dans .env.preprod}
      # Référence opaque des supports servie à l’API partenaire /v1. Meme regle : absente, refus de demarrer.
      PUBLIC_API_SUPPORT_REF_KEY: ${PUBLIC_API_SUPPORT_REF_KEY:?PUBLIC_API_SUPPORT_REF_KEY manquante dans .env.preprod}
      # Coffre des webhooks partenaires (URL + secret). Meme regle : absente, refus de demarrer.
      PARTNER_WEBHOOK_KEY: ${PARTNER_WEBHOOK_KEY:?PARTNER_WEBHOOK_KEY manquante dans .env.preprod}
      # Signature du scellement Vente.
      NF525_SEAL_KEY: ${NF525_SEAL_KEY:?NF525_SEAL_KEY manquante dans .env.preprod}
      # Signature du scellement Compta.
      NF525_COMPTA_SEAL_KEY: ${NF525_COMPTA_SEAL_KEY:?NF525_COMPTA_SEAL_KEY manquante dans .env.preprod}
      # Signature du scellement Facturation.
      NF525_FACTURATION_SEAL_KEY: ${NF525_FACTURATION_SEAL_KEY:?NF525_FACTURATION_SEAL_KEY manquante dans .env.preprod}
      # Scellement des signatures electroniques (mandat SEPA + contrat d'abonnement, App\Signature).
      SIGNATURE_SEAL_KEY: ${SIGNATURE_SEAL_KEY:?SIGNATURE_SEAL_KEY manquante dans .env.preprod}
      # Autorise le prestataire de paiement en ligne de DEMONSTRATION (bouchon qui signe ses propres
      # recus). 1 en PREPRODUCTION pour tester le tunnel d'achat de bout en bout ; 0 (ou absent) en
      # PRODUCTION, ou un vrai PSP doit etre branche. Sans cette ligne, la variable de .env.preprod
      # n'atteint pas le conteneur et POST /api/boutique/paniers/{id}/payer repond 500
      # (StubPaymentReceiptSigner refuse de servir un faux « accepte »).
      PAIEMENT_EN_LIGNE_BOUCHON_AUTORISE: ${PAIEMENT_EN_LIGNE_BOUCHON_AUTORISE:-0}
      # Autorise le terminal de paiement SIMULE de la caisse (TpeMock). 1 en PREPRODUCTION pour
      # demontrer l'encaissement par carte ; 0 (ou absent) ailleurs : la carte est refusee (422
      # « aucun terminal de paiement configure »). Seul ce service encaisse : ni le worker ni
      # l'ordonnanceur n'appellent le terminal.
      TPE_SIMULE_AUTORISE: ${TPE_SIMULE_AUTORISE:-0}
    depends_on:
      db:
        condition: service_healthy

  # ── ORDONNANCEUR ────────────────────────────────────────────────────────────────────────────
  #
  # L'appel periodique qui manquait. Vingt-deux taches cataloguees, un lanceur capable de les
  # executer, et personne pour l'appeler : les vingt-deux a « JAMAIS » au 31/08.
  #
  # ⚠ SOUS PROFIL, DONC PAS DEMARRE PAR UN DEPLOIEMENT DE ROUTINE :
  #
  #     docker compose -f infra/compose.preprod.yaml --env-file infra/.env.preprod \
  #         --profile ordonnanceur up -d scheduler
  #
  # La premiere execution REVOQUE des droits reellement perimes. C'est l'effet voulu et il se defait
  # en reattribuant — mais c'est un effet, et `deploy-preprod.sh` ne doit pas le declencher a l'insu
  # de celui qui deploie.
  #
  # La liste des taches autorisees vit dans `infra/ordonnanceur.sh`, pas ici : elle merite d'etre lue
  # avec ses raisons, et un fichier de composition n'est pas l'endroit ou on argumente. Deux taches
  # aujourd'hui, arbitrees par Maxime le 31/08.
  #
  # Ce qui a REELLEMENT tourne se lit ailleurs, et c'est la seule reponse qui vaille :
  #     php bin/console platform:scheduler:run --status
  scheduler:
    profiles: ["ordonnanceur"]
    build:
      context: ../docker/php
    restart: unless-stopped
    mem_limit: 512m
    working_dir: /app
    entrypoint: ["/bin/sh", "/infra/ordonnanceur.sh"]
    volumes:
      - ../app:/app
      - app_var:/app/var
      - ../infra:/infra:ro
      - ../docker/php/conf.d/zz-memory.ini:/usr/local/etc/php/conf.d/zz-memory.ini:ro
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET manquant dans .env.preprod}
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=11.4.2-MariaDB&charset=utf8mb4"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE manquant dans .env.preprod}
      # ── CLES DE CHIFFREMENT ET DE SCELLEMENT ───────────────────────────────────────────────
      #
      # ⚠ `:?` ET NON UNE VALEUR PAR DEFAUT. Une valeur par defaut ferait demarrer le conteneur
      # sans qu'on apprenne jamais qu'il manque un secret -- c'est exactement comme ca que les cles
      # du depot se sont propagees. Ici l'absence est BRUYANTE.
      # Documents de la GED, chiffres au repos.
      DMS_ENCRYPTION_KEY: ${DMS_ENCRYPTION_KEY:?DMS_ENCRYPTION_KEY manquante dans .env.preprod}
      # Second facteur d'authentification.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY manquante dans .env.preprod}
      # Coordonnees bancaires (mandats SEPA).
      SEPA_IBAN_KEY: ${SEPA_IBAN_KEY:?SEPA_IBAN_KEY manquante dans .env.preprod}
      # Cles d'API tierces confiees par le client.
      OCR_API_KEY_ENCRYPTION_KEY: ${OCR_API_KEY_ENCRYPTION_KEY:?OCR_API_KEY_ENCRYPTION_KEY manquante dans .env.preprod}
      # Jetons des comptes de reseaux sociaux.
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:?SOCIAL_TOKEN_ENCRYPTION_KEY manquante dans .env.preprod}
      # Coffre des URL de webhook du module « connecteurs ». Même forme que ses quatre
      # sœurs : absente, le conteneur refuse de démarrer plutôt que de chiffrer pour de faux.
      INTEGRATIONS_WEBHOOK_KEY: ${INTEGRATIONS_WEBHOOK_KEY:?INTEGRATIONS_WEBHOOK_KEY manquante dans .env.preprod}
      # Signature d’un code de support scanne (billet/carte/badge) : une cle connue = un code
      # d’acces forgeable. Absente, le conteneur refuse de demarrer plutot que de signer pour de faux.
      SUPPORT_HMAC_KEY: ${SUPPORT_HMAC_KEY:?SUPPORT_HMAC_KEY manquante dans .env.preprod}
      # Tokenisation HMAC de l’IBAN (module SEPA partage). Meme regle que ci-dessus.
      SEPA_IBAN_HMAC_KEY: ${SEPA_IBAN_HMAC_KEY:?SEPA_IBAN_HMAC_KEY manquante dans .env.preprod}
      # Référence opaque des supports servie à l’API partenaire /v1. Meme regle : absente, refus de demarrer.
      PUBLIC_API_SUPPORT_REF_KEY: ${PUBLIC_API_SUPPORT_REF_KEY:?PUBLIC_API_SUPPORT_REF_KEY manquante dans .env.preprod}
      # Coffre des webhooks partenaires (URL + secret). Meme regle : absente, refus de demarrer.
      PARTNER_WEBHOOK_KEY: ${PARTNER_WEBHOOK_KEY:?PARTNER_WEBHOOK_KEY manquante dans .env.preprod}
      # Signature du scellement Vente.
      NF525_SEAL_KEY: ${NF525_SEAL_KEY:?NF525_SEAL_KEY manquante dans .env.preprod}
      # Signature du scellement Compta.
      NF525_COMPTA_SEAL_KEY: ${NF525_COMPTA_SEAL_KEY:?NF525_COMPTA_SEAL_KEY manquante dans .env.preprod}
      # Signature du scellement Facturation.
      NF525_FACTURATION_SEAL_KEY: ${NF525_FACTURATION_SEAL_KEY:?NF525_FACTURATION_SEAL_KEY manquante dans .env.preprod}
      # Scellement des signatures electroniques (blocs php/scheduler maintenus identiques).
      SIGNATURE_SEAL_KEY: ${SIGNATURE_SEAL_KEY:?SIGNATURE_SEAL_KEY manquante dans .env.preprod}
      # Meme flag que le service php (blocs maintenus identiques). Voir le commentaire la-haut.
      PAIEMENT_EN_LIGNE_BOUCHON_AUTORISE: ${PAIEMENT_EN_LIGNE_BOUCHON_AUTORISE:-0}
    depends_on:
      db:
        condition: service_healthy

  # ── LIVRAISON DES WEBHOOKS PARTENAIRES (spec API partenaire v1, §3.5) ────────────────────────
  #
  # Le transport `async` (en base) n'avait AUCUN consommateur : un message mis en file y restait.
  # Deux consommateurs (`scale`), chacun repart toutes les heures ou au-dela de 256 Mo — un worker qui
  # tourne des jours accumule la memoire de chaque message. `restart: always` le relance.
  #
  # ARRET PROPRE : `messenger:consume` traite SIGTERM — il finit le message en cours puis s'arrete ;
  # `stop_grace_period` lui en laisse le temps (un envoi dure 8 s au plus).
  #
  # INTERRUPTEUR : `PARTNER_WEBHOOKS_ENABLED` (0 par defaut). Ferme, rien ne part et les livraisons
  # restent en file, remises toutes les minutes ; elles repartent a la reouverture.
  #
  # DNS : `dns_get_record()` n'a pas de delai propre. `RES_OPTIONS` borne la resolution a 2 s, un
  # essai (resolveur glibc de l'image Debian) — c'est le delai DNS de l'anti-SSRF.
  worker:
    build:
      context: ../docker/php
    restart: always
    scale: 2
    mem_limit: 384m
    working_dir: /app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      # Vivant = le processus de consommation tourne dans le conteneur.
      test: ["CMD-SHELL", "grep -qa messenger:consume /proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - ../app:/app
      - app_var:/app/var
      - ../docker/php/conf.d/zz-memory.ini:/usr/local/etc/php/conf.d/zz-memory.ini:ro
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      RES_OPTIONS: "timeout:2 attempts:1"
      PARTNER_WEBHOOKS_ENABLED: ${PARTNER_WEBHOOKS_ENABLED:-0}
      APP_SECRET: ${APP_SECRET:?APP_SECRET manquant dans .env.preprod}
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=11.4.2-MariaDB&charset=utf8mb4"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE manquant dans .env.preprod}
      # Les memes cles que `php` : un message peut toucher n'importe quel module (`:?`, jamais de defaut).
      DMS_ENCRYPTION_KEY: ${DMS_ENCRYPTION_KEY:?DMS_ENCRYPTION_KEY manquante dans .env.preprod}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY manquante dans .env.preprod}
      SEPA_IBAN_KEY: ${SEPA_IBAN_KEY:?SEPA_IBAN_KEY manquante dans .env.preprod}
      OCR_API_KEY_ENCRYPTION_KEY: ${OCR_API_KEY_ENCRYPTION_KEY:?OCR_API_KEY_ENCRYPTION_KEY manquante dans .env.preprod}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:?SOCIAL_TOKEN_ENCRYPTION_KEY manquante dans .env.preprod}
      INTEGRATIONS_WEBHOOK_KEY: ${INTEGRATIONS_WEBHOOK_KEY:?INTEGRATIONS_WEBHOOK_KEY manquante dans .env.preprod}
      SUPPORT_HMAC_KEY: ${SUPPORT_HMAC_KEY:?SUPPORT_HMAC_KEY manquante dans .env.preprod}
      SEPA_IBAN_HMAC_KEY: ${SEPA_IBAN_HMAC_KEY:?SEPA_IBAN_HMAC_KEY manquante dans .env.preprod}
      PUBLIC_API_SUPPORT_REF_KEY: ${PUBLIC_API_SUPPORT_REF_KEY:?PUBLIC_API_SUPPORT_REF_KEY manquante dans .env.preprod}
      PARTNER_WEBHOOK_KEY: ${PARTNER_WEBHOOK_KEY:?PARTNER_WEBHOOK_KEY manquante dans .env.preprod}
      NF525_SEAL_KEY: ${NF525_SEAL_KEY:?NF525_SEAL_KEY manquante dans .env.preprod}
      NF525_COMPTA_SEAL_KEY: ${NF525_COMPTA_SEAL_KEY:?NF525_COMPTA_SEAL_KEY manquante dans .env.preprod}
      NF525_FACTURATION_SEAL_KEY: ${NF525_FACTURATION_SEAL_KEY:?NF525_FACTURATION_SEAL_KEY manquante dans .env.preprod}
      SIGNATURE_SEAL_KEY: ${SIGNATURE_SEAL_KEY:?SIGNATURE_SEAL_KEY manquante dans .env.preprod}
      PAIEMENT_EN_LIGNE_BOUCHON_AUTORISE: ${PAIEMENT_EN_LIGNE_BOUCHON_AUTORISE:-0}
    depends_on:
      db:
        condition: service_healthy

  # ── SAUVEGARDE DE LA BASE ───────────────────────────────────────────────────────────────────
  #
  # Il n'y en avait AUCUNE. Mesure du 31/08 : pas de dump, pas de tache qui en fasse, et
  # `doctrine:fixtures:load` absente en preprod — `composer install --no-dev` retire le paquet. Les
  # 38 classes de fixtures decrivent tout le jeu de demonstration et ne peuvent pas etre rejouees.
  #
  # Le volume `db_data` est persistant : c'est de la DURABILITE, pas de la RECUPERABILITE. Il
  # survit a un redemarrage, pas a un DELETE. Deux ecritures irreversibles ont eu lieu le meme jour,
  # sans operation inverse dans l'API.
  #
  # ⚠ PAS DE PROFIL, contrairement a l'ordonnanceur : une sauvegarde qu'il faut penser a demarrer
  # est une sauvegarde qui n'existera pas le jour ou elle servirait. L'ordonnanceur revoque des
  # droits — c'est un effet, il se demande. Celle-ci ne fait que lire.
  #
  # La destination est HORS DU DEPOT : un dump contient des donnees personnelles, meme de
  # demonstration, et n'a rien a faire dans un arbre git.
  #
  # Restauration — ecrite ici parce qu'une sauvegarde dont personne ne connait la commande n'en est
  # pas une :
  #     gunzip -c /home/debian/sauvegardes-billetterie/<fichier>.sql.gz \
  #       | docker exec -i billetterie-preprod-db-1 mariadb -u root -p<motdepasse> <base>
  sauvegarde:
    image: mariadb:11.4
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["/bin/sh", "/infra/sauvegarde-base.sh"]
    volumes:
      - ../infra:/infra:ro
      - /home/debian/sauvegardes-billetterie:/sauvegardes
    environment:
      DB_NAME: ${DB_NAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env.preprod}
      SAUVEGARDE_RETENTION_JOURS: "14"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ../app:/app:ro
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11.4
    restart: unless-stopped
    mem_limit: 1500m
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env.preprod}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env.preprod}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_var:
