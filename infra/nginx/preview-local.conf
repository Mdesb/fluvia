# Vhost de prévisualisation, accessible UNIQUEMENT par tunnel SSH.
#
# Sert exactement la même chose que le vhost public (frontend React + API),
# mais sans TLS ni Basic Auth : il n'écoute que sur 127.0.0.1, donc y accéder
# suppose déjà d'être authentifié par clé SSH sur la machine.
#
# Utilité : voir la préprod sans dépendre du DNS. Le TTL des enregistrements
# est de 3 h, donc après un changement d'IP un poste peut continuer à voir
# l'ancien serveur pendant tout ce temps.
#
# Installation :
#   sudo cp infra/nginx/preview-local.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/preview-local.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Usage depuis le PC de dev :
#   ssh -N -L 8090:127.0.0.1:8090 vps-preprod
#   puis http://localhost:8090

server {
    listen 127.0.0.1:8090;
    server_name _;

    root /var/www/smartaccess;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ~ ^/(api|auth|me|reporting)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 20m;
}
