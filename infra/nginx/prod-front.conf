# Point d'entrée public de la PRODUCTION — service `front` de infra/compose.prod.yaml.
#
# Dérivé de infra/nginx/billetterie-preprod.conf (le Nginx natif de l'hôte en préprod). Ce qui change :
#   - `listen 80` seul : le TLS est terminé chez Fabrice, en amont. Ni certificat, ni certbot, ni
#     défi ACME, ni redirection 80 -> 443 (elle bouclerait : tout arrive ici en HTTP).
#   - pas de `server_name` : l'hôte préserve `Host` (portal.fluvia-app.com, et demain
#     clientX.fluvia-app.com) ; tous les noms routés vers ce conteneur servent la même application.
#   - l'API est relayée vers `web:80` (réseau Docker), et non vers 127.0.0.1:8081.
#
# ── LE PROTOCOLE VIENT DE L'AMONT, PAS DE CE SERVEUR ───────────────────────────────────────────
#
# ⚠ `$scheme` vaudrait ICI « http » : c'est le protocole entre Apache et ce Nginx. Le relayer dirait
# à Symfony qu'il est servi en clair — liens absolus en http, cookies sans `Secure`, redirections
# vers http. On relaie donc ce qu'Apache a posé (`X-Forwarded-Proto: https`, en place depuis le
# 28/10), et Symfony s'y fie parce que TRUSTED_PROXIES couvre la chaîne (compose.prod.yaml).

server {
    listen 80;
    listen [::]:80;

    root /srv/www;
    index index.html;

    # Le portail est une application, pas un site : il ne doit pas être indexé.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # En préprod, la liste des ancêtres autorisés vient d'un fragment propre à l'hôte. Ici aucune
    # intégration tierce n'est prévue : seule l'application peut s'encadrer elle-même.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Mêmes chemins que la préprod : la documentation de l'API, les ressources des bundles et toutes
    # les routes servies par Symfony. Un chemin oublié ici tombe sur le repli de l'application
    # (index.html, 200) — l'appel « réussit » et rend du HTML. La liste se tient avec celle de
    # infra/nginx/billetterie-preprod.conf.
    location ^~ /api/docs {
        proxy_pass http://web:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /bundles/ {
        proxy_pass http://web:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(v1|api|auth|me|reporting|media|dms|sepa|audit|calendar|health|mot-de-passe|utilisateurs|factures)(/|$) {
        proxy_pass http://web:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Le marqueur que deploy-prod.sh relit : jamais en cache, sinon la boucle de vérification
    # comparerait le commit déployé à celui d'avant.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }

    # Application monopage : toute route inconnue rend la coquille.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker et le manifeste ne doivent jamais être mis en cache : un ancien sw.js
    # continuerait de servir les assets d'avant le déploiement.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # Assets nommés par leur empreinte : cache long sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    client_max_body_size 20m;
}
