# ── SOURCE DE VERITE, RECONCILIEE AVEC LE SERVEUR LE 2026-09-20 ──
# Ce fichier reflete la conf LIVE de /etc/nginx/sites-available/billetterie-preprod.conf : il peut
# etre recopie tel quel. Etat aligne : Basic Auth LEVE (28/08, demande de Maxime — voir les lignes
# `auth_basic` commentees plus bas), routes API incluant `factures`, et assets API Platform sous
# `/bundles/` routes vers PHP (sinon Swagger UI a /api/docs revient en index.html : « Unexpected
# token '<' », onglet API blanc). Avant toute recopie future, diffez quand meme contre le serveur,
# il peut avoir bouge :
#   diff /etc/nginx/sites-available/billetterie-preprod.conf infra/nginx/billetterie-preprod.conf

include /etc/nginx/snippets/fluvia-frame-ancestors.conf;

# Reverse proxy de l'hôte pour la préprod.
#
# Deux choses sont servies sur la MÊME origine, c'est indispensable :
#   - le frontend React (build Vite) en statique depuis /var/www/smartaccess
#   - l'API Symfony, proxifiée vers la stack Docker sur 127.0.0.1:8081
#
# Le client HTTP du frontend (frontend/src/api/client.js) appelle des chemins
# relatifs (/api, /auth, /me, /reporting) précisément pour éviter tout CORS :
# en dev c'est le proxy de Vite qui les relaie, en préprod c'est ce fichier.
# Le back n'autorise en CORS que `content-type` et `authorization`, alors que le
# flux de vente envoie aussi `X-Etablissement` — servir sur deux origines
# casserait donc la vente.
#
# Installation :
#   sudo cp infra/nginx/billetterie-preprod.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/billetterie-preprod.conf /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/.htpasswd-preprod monlogin
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d smartaccess.hector-conseil.com
#
# Ce fichier est en HTTP seul : certbot y injecte la partie TLS et la
# redirection 80 -> 443. Après toute modification, réinjecter le certificat :
#   sudo certbot install --cert-name smartaccess.hector-conseil.com --nginx

server {
    server_name smartaccess.hector-conseil.com;

    root /var/www/smartaccess;
    index index.html;

    # Une préprod indexée par Google = des pages de billetterie fantômes dans
    # les résultats de recherche. Ceinture (en-tête) + bretelles (robots.txt).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Sans cet en-tete, n'importe quel site peut afficher une boutique dans une iframe, sous son
    # propre nom : le visiteur paie sur une page qu'il croit etre celle du site encadrant. Rien ne
    # casse et rien n'alerte -- c'est pour ca que personne ne le remarque.
    #
    # La valeur vient de la carte incluse en tete de fichier. `always` : sinon l'en-tete saute sur
    # les reponses d'erreur, et une page 404 encadree reste une page encadree.
    add_header Content-Security-Policy "frame-ancestors $fluvia_frame_ancestors" always;

    # LEVEE LE 28/08 A LA DEMANDE DE MAXIME, pour pouvoir ouvrir les ecrans dans un navigateur.
    #
    # Ce que cela expose : le bundle React et la page de connexion. RIEN DE PLUS -- l'API etait
    # deja hors du Basic Auth (voir plus bas, c'est documente), et les donnees restent derriere le
    # JWT de l'application. `robots.txt` interdit toujours l'indexation, et l'en-tete X-Robots-Tag
    # aussi.
    #
    # POUR REMETTRE LA PROTECTION :
    #   sudo cp /etc/nginx/sites-available/billetterie-preprod.conf.avant-ouverture-28-08 \
    #           /etc/nginx/sites-available/billetterie-preprod.conf
    #   sudo nginx -t && sudo systemctl reload nginx
    #
    # auth_basic "Preprod - acces restreint";
    # auth_basic_user_file /etc/nginx/.htpasswd-preprod;

    # Let's Encrypt doit pouvoir valider le domaine sans passer l'auth.
    # `^~` prime sur les locations regex ci-dessous.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Documentation de l'API : pas appelée par le frontend, on peut la garder
    # derrière le mot de passe. `^~` prime sur la location regex qui suit.
    location ^~ /api/docs {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets statiques d'API Platform (Swagger UI / ReDoc : CSS, JS, polices, images), servis par
    # Symfony depuis public/bundles/. Sans cette entree, `/bundles/apiplatform/...` tombe sur le
    # `location /` du frontend et rend `index.html` (200 text/html) a la place du JavaScript :
    # Swagger UI ne se charge jamais et la console dit « Unexpected token '<' ». Meme defaut et meme
    # remede que `media|dms|sepa` ci-dessous. `^~` prime sur le `location /`.
    location ^~ /bundles/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Symfony. Location regex : prime sur le `location /` du frontend.
    #
    # /!\ auth_basic est DÉSACTIVÉ ici, et ce n'est pas un oubli : le Basic Auth
    # et le JWT de l'application utilisent tous deux l'en-tête `Authorization`.
    # Une fois l'utilisateur connecté, le client envoie `Authorization: Bearer …`,
    # ce qui écrase l'en-tête `Basic` du navigateur — Nginx renvoyait alors 401
    # et le navigateur redemandait le mot de passe à chaque requête.
    # La protection reste assurée par l'application elle-même : sans jeton
    # valide, l'API répond 401.
    # `media` ajoute le 28/08 : les photos de produit sont servies par Symfony, publiquement et
    # sans jeton. Sans cette entree, `/media/produit/{id}` tombait sur le `location /` du frontend
    # et rendait `index.html` a la place de l'image -- une reponse 200 qui n'est pas une photo.
    # `dms` et `sepa` ajoutes le 28/08 : ils servent des FICHIERS -- un document, un fichier de
    # prelevement pain.008. Hors de cette liste, la requete tombait sur le frontend et rendait
    # `index.html` : un telechargement qui « reussit » et ouvre une page blanche.
    # Ajoutes le 28/08 apres mesure sur la preprod : ces cinq prefixes sont des routes SYMFONY,
    # et ils tombaient tous sur le `location /` du frontend.
    #   POST /utilisateurs/activation -> 405 : un compte neuf ne pouvait pas s activer.
    #   POST /mot-de-passe/oublie     -> 405 : « mot de passe oublie » ne repondait pas.
    #   /calendar/ics/{token}.ics     -> 200 text/html : l abonnement ICS rendait la coquille
    #                                    du SPA. Google et Apple reessaient en silence :
    #                                    l abonnement « reussit » et n affiche jamais rien.
    #   /audit/export                 -> 200 text/html : un export qui telecharge une page web.
    #   /health                       -> 200 text/html : LE PIRE. Un controle de sante qui
    #                                    repond « en vie » quoi qu il arrive, donc une
    #                                    supervision verte pendant une panne totale.
    #
    # Meme defaut que `media|dms|sepa` un peu plus haut, et meme remede. La liste doit suivre
    # les routes hors API Platform : `grep -rhoP "#\[Route\('\K/[a-z0-9_-]+" app/src | sort -u`.
    location ~ ^/(v1|api|auth|me|reporting|media|dms|sepa|audit|calendar|health|mot-de-passe|utilisateurs|factures)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend React. Le routage se fait côté navigateur : toute URL inconnue
    # doit renvoyer index.html, sinon un rechargement (F5) sur une page interne
    # donnerait un 404.
    # ⚠ UN MARQUEUR ABSENT DOIT DIRE 404, PAS RENDRE LA PAGE D'ACCUEIL.
    #
    # Sans cette entree, `/version.json` tombe sur le `location /` ci-dessous et rend `index.html`
    # avec un code 200. Un outil qui verifie « le marqueur repond-il ? » conclut alors que oui, en
    # lisant du HTML. `bin/version-servie.py` exige du JSON et s'en protege — mais il est le seul
    # ecrit avec cette precaution, et il ne protege que lui-meme.
    #
    # `=` est une correspondance EXACTE : elle prime sur toutes les autres, quel que soit l'ordre.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # LE SERVICE WORKER NE SE MET JAMAIS EN CACHE.
    #
    # `location /` ne pose aucun en-tete de cache : le navigateur applique alors une heuristique et
    # garde ce fichier plusieurs heures. Or un service worker perime est le PIRE des caches -- c'est
    # lui qui decide de ce qui est servi. Un deploiement resterait invisible jusqu'a ce que
    # l'utilisateur vide son navigateur, et personne ne penserait a le lui demander.
    #
    # `add_header` ici REMPLACE ceux du bloc server : X-Robots-Tag est redeclare. La politique
    # `frame-ancestors` n'a pas de sens sur un fichier JavaScript et n'est pas reprise, comme dans
    # `location /assets/` juste en dessous.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # `mime.types` ne connait pas `.webmanifest` : sans cette ligne il part en
    # `application/octet-stream` -- mesure le 28/08 sur cette preprod. Chrome s'en plaint dans la
    # console ; d'autres navigateurs l'ignorent, et l'invite d'installation ne se declenche jamais,
    # sans message. C'est le dernier metre entre une PWA deployee et une PWA installable.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # Les assets Vite portent un hash dans leur nom : cache long sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    client_max_body_size 20m;

    access_log /var/log/nginx/billetterie-preprod.access.log;
    error_log  /var/log/nginx/billetterie-preprod.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/smartaccess.hector-conseil.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/smartaccess.hector-conseil.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = smartaccess.hector-conseil.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name smartaccess.hector-conseil.com;
    return 404; # managed by Certbot


}