include /etc/nginx/snippets/fluvia-frame-ancestors.conf;

# Reverse proxy de l'hôte pour la préprod.
#
# Deux choses sont servies sur la MÊME origine, c'est indispensable :
#   - le frontend React (build Vite) en statique depuis /var/www/smartaccess
#   - l'API Symfony, proxifiée vers la stack Docker sur 127.0.0.1:8081
#
# Le client HTTP du frontend (frontend/src/api/client.js) appelle des chemins
# relatifs (/api, /auth, /me, /reporting) précisément pour éviter tout CORS :
# en dev c'est le proxy de Vite qui les relaie, en préprod c'est ce fichier.
# Le back n'autorise en CORS que `content-type` et `authorization`, alors que le
# flux de vente envoie aussi `X-Etablissement` — servir sur deux origines
# casserait donc la vente.
#
# Installation :
#   sudo cp infra/nginx/billetterie-preprod.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/billetterie-preprod.conf /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/.htpasswd-preprod monlogin
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d smartaccess.hector-conseil.com
#
# Ce fichier est en HTTP seul : certbot y injecte la partie TLS et la
# redirection 80 -> 443. Après toute modification, réinjecter le certificat :
#   sudo certbot install --cert-name smartaccess.hector-conseil.com --nginx

# ⚠ CE FICHIER N'EST PAS DEPLOYE AUTOMATIQUEMENT, ET IL DIVERGE DU SERVEUR.
#
# `infra/deploy-preprod.sh` ne touche jamais a nginx : ce fichier n'est applique que si quelqu'un
# le recopie a la main. C'est ainsi que la derive s'est installee sans que rien ne la signale — le
# 28/08, le serveur avait trois prefixes de routes que le depot ignorait, et le depot avait deux
# blocs PWA que le serveur n'avait pas. Les deux moities etaient fausses.
#
# ⚠ DIVERGENCE CONNUE, VOLONTAIRE, ET NON RESOLUE : le Basic Auth.
#
# Le serveur l'a LEVE le 28/08 a la demande de Maxime, pour pouvoir ouvrir les ecrans dans un
# navigateur. Ce fichier, lui, le declare toujours actif. **Recopier ce fichier tel quel sur la
# preprod remettrait donc une authentification que quelqu'un a explicitement demande de retirer.**
#
# Inscrire cette levee ici est une decision de securite qui n'appartient pas a celui qui passait
# par la. Elle est donc signalee, pas prise. Avant toute recopie :
#
#   diff /etc/nginx/sites-available/billetterie-preprod.conf infra/nginx/billetterie-preprod.conf
#
# et lire ce que la difference ferait, plutot que de supposer que le depot a raison.

server {
    server_name smartaccess.hector-conseil.com;

    root /var/www/smartaccess;
    index index.html;

    # Une préprod indexée par Google = des pages de billetterie fantômes dans
    # les résultats de recherche. Ceinture (en-tête) + bretelles (robots.txt).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Sans cet en-tete, n'importe quel site peut afficher une boutique dans une iframe, sous son
    # propre nom : le visiteur paie sur une page qu'il croit etre celle du site encadrant. Rien ne
    # casse et rien n'alerte -- c'est pour ca que personne ne le remarque.
    #
    # La valeur vient de la carte incluse en tete de fichier. `always` : sinon l'en-tete saute sur
    # les reponses d'erreur, et une page 404 encadree reste une page encadree.
    add_header Content-Security-Policy "frame-ancestors $fluvia_frame_ancestors" always;

    auth_basic "Preprod - acces restreint";
    auth_basic_user_file /etc/nginx/.htpasswd-preprod;

    # Let's Encrypt doit pouvoir valider le domaine sans passer l'auth.
    # `^~` prime sur les locations regex ci-dessous.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Documentation de l'API : pas appelée par le frontend, on peut la garder
    # derrière le mot de passe. `^~` prime sur la location regex qui suit.
    location ^~ /api/docs {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Symfony. Location regex : prime sur le `location /` du frontend.
    #
    # /!\ auth_basic est DÉSACTIVÉ ici, et ce n'est pas un oubli : le Basic Auth
    # et le JWT de l'application utilisent tous deux l'en-tête `Authorization`.
    # Une fois l'utilisateur connecté, le client envoie `Authorization: Bearer …`,
    # ce qui écrase l'en-tête `Basic` du navigateur — Nginx renvoyait alors 401
    # et le navigateur redemandait le mot de passe à chaque requête.
    # La protection reste assurée par l'application elle-même : sans jeton
    # valide, l'API répond 401.
    # ── LES DOUZE PREFIXES SERVEUR, ET COMMENT ON EN EST ARRIVE LA ─────────────────────────────
    #
    # Le 28/08, cinq routes Symfony tombaient sur le `location /` du frontend. Mesure sur la
    # preprod avant correctif :
    #
    #   POST /utilisateurs/activation   405            un compte neuf ne pouvait pas s activer
    #   POST /mot-de-passe/oublie       405            « mot de passe oublie » ne repondait pas
    #   /calendar/ics/{token}.ics       200 text/html  l abonnement ICS rendait la coquille du SPA
    #   /audit/export                   200 text/html  un export qui telecharge une page web
    #   /health                         200 text/html  LE PIRE : un controle de sante qui repond
    #                                                  « en vie » quoi qu il arrive, donc une
    #                                                  supervision verte pendant une panne totale
    #
    # `media`, `dms` et `sepa` avaient ete ajoutes le meme jour pour le meme defaut : ils servent
    # des FICHIERS, et hors de cette liste la requete rendait `index.html` — un telechargement qui
    # « reussit » et ouvre une page blanche.
    #
    # La liste doit suivre les routes hors API Platform. Pour la verifier :
    #   grep -rhoP "#\[Route\('\K/[a-z0-9_-]+" app/src | sort -u
    location ~ ^/(api|auth|me|reporting|media|dms|sepa|audit|calendar|health|mot-de-passe|utilisateurs)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend React. Le routage se fait côté navigateur : toute URL inconnue
    # doit renvoyer index.html, sinon un rechargement (F5) sur une page interne
    # donnerait un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # LE SERVICE WORKER NE SE MET JAMAIS EN CACHE.
    #
    # `location /` ne pose aucun en-tete de cache : le navigateur applique alors une heuristique et
    # garde ce fichier plusieurs heures. Or un service worker perime est le pire des caches — c'est
    # LUI qui decide de ce qui est servi. Un deploiement resterait invisible jusqu'a ce que
    # l'utilisateur vide son navigateur, et personne ne penserait a le lui demander.
    #
    # `add_header` ici REMPLACE ceux du bloc server : X-Robots-Tag est redeclare. La politique
    # `frame-ancestors` n'a pas de sens sur un fichier JavaScript et n'est pas reprise.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # `mime.types` ne connait pas `.webmanifest` : sans cette ligne il part en
    # `application/octet-stream`. Chrome s'en plaint dans la console ; d'autres navigateurs
    # l'ignorent, et l'invite d'installation ne se declenche jamais — sans message.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # LE MARQUEUR DE VERSION DOIT POUVOIR DIRE QU'IL EST ABSENT.
    #
    # Sans cette localisation exacte, le repli SPA de `location /` rendrait `index.html` avec un
    # code 200 pour un `version.json` manquant. Or ce fichier sert precisement a lever un doute :
    # « la preproduction contient-elle ce que je viens de lire ? ». Un marqueur qui repond 200 avec
    # du HTML quand il n'existe pas transforme l'outil qui leve le doute en outil qui le confirme.
    #
    # Signale par allaccess-b8, temoin de controle a l'appui : une URL inventee rendait elle aussi
    # 200 text/html. Le cache est interdit pour la meme raison que `sw.js` -- un marqueur de version
    # perime dirait le contraire de ce qu'on lui demande.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # Les assets Vite portent un hash dans leur nom : cache long sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    client_max_body_size 20m;

    access_log /var/log/nginx/billetterie-preprod.access.log;
    error_log  /var/log/nginx/billetterie-preprod.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/smartaccess.hector-conseil.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/smartaccess.hector-conseil.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = smartaccess.hector-conseil.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name smartaccess.hector-conseil.com;
    return 404; # managed by Certbot


}