# Reverse proxy de l'hôte vers la stack de préprod (127.0.0.1:8081).
#
# Installation :
#   sudo cp infra/nginx/billetterie-preprod.conf /etc/nginx/sites-available/
#   sudo sed -i 's/smartaccess.hector-conseil.com/preprod.tondomaine.fr/' /etc/nginx/sites-available/billetterie-preprod.conf
#   sudo ln -sf /etc/nginx/sites-available/billetterie-preprod.conf /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/.htpasswd-preprod monlogin
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d preprod.tondomaine.fr      # ajoute le bloc HTTPS
#
# Ce fichier est en HTTP seul : certbot y injecte lui-même la partie TLS
# et la redirection 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name smartaccess.hector-conseil.com;

    # Une préprod indexée par Google = des pages de billetterie fantômes dans
    # les résultats de recherche. Ceinture (en-tête) + bretelles (robots.txt).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    auth_basic "Preprod - acces restreint";
    auth_basic_user_file /etc/nginx/.htpasswd-preprod;

    # Let's Encrypt doit pouvoir valider le domaine sans passer l'auth.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 20m;

    access_log /var/log/nginx/billetterie-preprod.access.log;
    error_log  /var/log/nginx/billetterie-preprod.error.log;
}
