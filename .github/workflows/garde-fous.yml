# Garde-fous partagés (C4/C16/C19) — voir COORDINATION/PLAYBOOK.md §9.
#
# ⚠ CE WORKFLOW TOURNE, ET IL EST BLOQUANT. Il se déclenche sur `pull_request` vers `origin`
# (github.com/Mdesb/fluvia), et ses deux jobs — « Tous les garde-fous du lanceur » et « Banc d'essai
# des garde-fous » — sont les deux checks REQUIS par la protection de `main`. Avec `auto-merge.yml`,
# une PR non brouillon fusionne DÈS qu'ils passent au vert : personne ne relit le diff derrière eux.
# Ces deux jobs sont le gate, en entier. Ce qu'ils laissent passer entre dans `main`.
#
# (Cet en-tête a affirmé le contraire — « ne tourne nulle part, pas de remote GitHub » — jusqu'à la
# migration. L'écho traîne encore dans les archives de COORDINATION/ : c'est périmé. Un commentaire
# qui dit « ceci ne tourne pas » sur un fichier qui bloque les PR invite à ne pas le relire.)
#
# Le hook `pre-receive` (C16) reste la seconde barrière, côté serveur : il garde le dépôt nu
# /home/debian/billetterie.git, aujourd'hui le remote `bare`, qui reçoit toujours des pushes. Les
# deux ne couvrent pas le même chemin — ce workflow ne voit que les `pull_request`, `pre-receive` ne
# voit que ce qui entre dans le nu — et aucune ne rend l'autre superflue.
#
# **Il délègue entièrement à `bin/garde-fous.sh`, et c'est délibéré.** Sa version précédente
# réimplémentait les appels : elle lançait le cloisonnement et le manifeste, mais ni le nommage
# anglais ni les secrets — écrits après elle. Un workflow nommé « Garde-fous » qui n'en lance que la
# moitié est pire qu'aucun workflow : il rend un vert au nom de contrôles qu'il n'a pas exécutés.
# En passant par le lanceur, il ne peut plus diverger de ce qui tourne en local et dans le hook.

name: Garde-fous

on:
  pull_request:

jobs:
  garde-fous:
    # Intitulé volontairement générique : la version précédente énumérait cinq contrôles alors
    # que le lanceur en exécute huit. Un nom qui liste ce qui tourne se périme au garde-fou
    # suivant, et un intitulé périmé annonce un vert plus étroit que la réalité — ou plus large.
    name: Tous les garde-fous du lanceur
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le cliquet relit le plafond de la ligne de base sur la branche
          # cible, et le contrôle de nommage compare les fichiers ajoutés. Sans l'historique, le
          # premier échoue bruyamment (c'est voulu) et le second n'a rien à comparer.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          # 8.4 comme l'image de préprod, pas 8.2 (le plancher déclaré par composer.json) : une CI
          # qui ne tourne pas sur la version de production valide autre chose que ce qui sera livré.
          php-version: '8.4'
          coverage: none

      # Nécessaire au seul contrôle du manifeste, qui passe par PHPUnit. Sans lui, `garde-fous.sh`
      # l'annonce ignoré au lieu de le rendre faussement vert — mais autant l'exécuter vraiment.
      - name: Dépendances
        working-directory: app
        run: composer install --no-interaction --no-scripts --no-progress

      # `--exiger-tout` : ici, un contrôle sauté faute d'outillage doit ÉCHOUER. Le lanceur les
      # compte et l'affiche, mais sort en 0 — raisonnable sur un poste, faux en CI, où un job vert
      # n'est pas relu. C'est le « vert au nom de contrôles non exécutés » que ce fichier refuse.
      - name: Tous les garde-fous
        run: ./bin/garde-fous.sh "origin/${{ github.base_ref || 'main' }}" --exiger-tout

  # Le banc d'essai des garde-fous eux-mêmes : ils sont du code qui juge du code, et deux faux
  # négatifs silencieux y ont déjà été trouvés. Il tourne sur un clone jetable du dépôt courant.
  banc:
    name: Banc d'essai des garde-fous
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # ⚠ SANS CETTE IMAGE, CE JOB ÉCHOUE ENTIÈREMENT — et il l'aurait fait au premier essai.
      #
      # Le banc pousse dans un dépôt nu dont le `pre-receive` lance les garde-fous dans un conteneur.
      # Sur un runner GitHub docker existe, mais cette image-là n'y est pas, et le hook REFUSE plutôt
      # que de laisser passer sans contrôle. Tous les cas d'acceptation tombent alors.
      #
      # Mesuré le 01/09 en pointant le banc sur une image inexistante : 5 échecs sur 17 — et, avant
      # que les cas de refus ne vérifient leur motif, les onze autres restaient faussement verts.
      #
      # On construit depuis le Dockerfile du dépôt plutôt que de prendre un `php:8.4-cli` : une CI
      # qui ne tourne pas sur l'image de production valide autre chose que ce qui sera livré.
      - name: Image PHP, celle de la préproduction
        run: docker build -t billetterie-preprod-php docker/php

      # Sur un evenement pull_request, actions/checkout laisse une HEAD detachee sans
      # branche locale `main`. Le banc clone ce depot (DEPOT_SOURCE=.git) puis, dans le
      # clone, committe sur `main` et la pousse vers un bare jetable pour eprouver le hook
      # pre-receive : sans etre attache a `main`, il echoue sur « src refspec main does
      # not match any ». On attache donc HEAD a `main` sur le commit teste. Sans effet en
      # local, ou le banc part du bare partage qui possede deja `main`.
      - name: Attacher HEAD a main pour le banc (pull_request = HEAD detachee)
        run: git checkout -B main

      - name: Les garde-fous refusent-ils vraiment ce qu'ils prétendent refuser ?
        env:
          # Sur GitHub le dépôt cloné EST la source ; en local le banc part du bare partagé.
          DEPOT_SOURCE: ${{ github.workspace }}/.git
        run: ./bin/essai-garde-fous.sh
