; Perf FPM sur bind-mount lent (dépôt sous OneDrive) : on évite de re-stat/valider
; les milliers de fichiers PHP à chaque requête. N'affecte PAS le CLI (enable_cli=0),
; donc phpunit / bin/console ne sont pas impactés et voient toujours le code frais.
; ⚠ Conséquence : après une modif de code PHP servie par le WEB, recharger le master
; FPM (`docker compose restart php`) pour que FPM voie les nouveaux fichiers.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
realpath_cache_size=8M
realpath_cache_ttl=600
