; Préprod et production seulement (monté par infra/compose.preprod.yaml et infra/compose.prod.yaml,
; pas par le compose de dev).
;
; Mesure du 28/10 : l'image n'a AUCUN php.ini (« Loaded Configuration File => (none) »), donc
; display_errors vaut STDOUT. Une erreur fatale levée avant le gestionnaire de Symfony (ici un
; app/.env.local illisible) a renvoyé au visiteur de https://portal.fluvia-app.com sa pile d'appels,
; chemins du serveur compris. expose_php annonçait en plus la version exacte de PHP à chaque réponse.
;
; Les erreurs ne disparaissent pas : elles partent dans le journal du conteneur (stderr de FPM),
; lisible par `docker compose logs php`. deploy-prod.sh vérifie que ce fichier est bien chargé.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
