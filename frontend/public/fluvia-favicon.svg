<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="224 4 640 640" fill="none" role="img" aria-label="Fluvia">
<!--
  FAVICON — DERIVE DE `marque/FLUVIA_Icon_Color_DarkBG.svg`, MEME CORRECTION DE CADRE.

  Voir `fluvia-mark.svg` pour le detail du defaut : les variantes « Icon » du pack debordent de
  232 unites a droite sur un cadre de 600.

  ⚠ POURQUOI LA VARIANTE A FOND SOMBRE POUR L'ONGLET, ET PAS LA TRANSPARENTE. Une favicon est posee
  par le navigateur sur SA propre barre, dont la couleur depend d'un theme qu'on ne choisit pas. Un
  mark en trait fin sur fond transparent disparait sur l'un des deux : le cyan de son extremite
  haute rend 1,76:1 sur du blanc, ce qui est illisible. Le fond navy rend la vignette identique
  partout, et il porte le mark a 11,29:1.

  Le carre couvre tout le cadre (`width="100%"`), donc il suit le `viewBox` corrige sans retouche.
-->
<defs>
  <linearGradient id="fluviaGradient" x1="360" y1="120" x2="720" y2="520" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#27D9D0"/>
    <stop offset="45%" stop-color="#168CEB"/>
    <stop offset="75%" stop-color="#3755E8"/>
    <stop offset="100%" stop-color="#7A2EE6"/>
  </linearGradient>
</defs>
<rect x="224" y="4" width="640" height="640" fill="#050914"/>
<g transform="translate(-165,-60) scale(1.28)">
  <path d="M360 470V220 C360 155 412 110 478 110 H670 C720 110 748 140 748 185 C748 230 720 258 670 258 H525 C482 258 455 286 455 330 V470"
        stroke="url(#fluviaGradient)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M455 355H590 C638 355 666 384 666 425 C666 466 638 490 590 490 H505"
        stroke="url(#fluviaGradient)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
