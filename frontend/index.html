<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LE NOM DU PRODUIT, PAS CELUI DU DEPOT. Ce titre est l'onglet du navigateur, le libelle de
         l'icone une fois l'application installee, et ce que l'utilisateur cherche dans sa liste de
         fenetres. « Billetterie » y nommait un depot que personne d'autre que nous ne connait. -->
    <title>Fluvia — IT Cotation</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Colore la barre systeme d'Android une fois l'application installee. Sans elle, un bandeau
         blanc coupe l'ecran en haut, et l'application a l'air d'une page web dans un cadre. -->
    <meta name="theme-color" content="#0d7d88" />
    <!-- ⚠ TROIS CHEMINS, TROIS BALISES — ET LE PREMIER MANQUAIT.
         L'onglet du navigateur, la barre de favoris et l'historique lisent `rel="icon"`, que ce
         fichier ne declarait pas : ils affichaient l'icone par defaut. Les deux autres balises
         donnaient l'impression que le sujet etait traite.
         Le SVG est prefere au PNG : une favicon est redessinee a une dizaine de tailles selon
         l'ecran et le contexte, et un vecteur les rend toutes nettes. -->
    <link rel="icon" type="image/png" href="/fluvia-512.png" />
    <!-- iOS ignore le manifeste ET ignore les favicons SVG : c'est cette balise, en PNG, qui donne
         l'icone de l'ecran d'accueil. -->
    <link rel="apple-touch-icon" href="/fluvia-192.png" />
    <meta name="apple-mobile-web-app-title" content="Fluvia" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
